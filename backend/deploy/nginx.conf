# nginx for домщенков.рф (xn--b1adduihee9g.xn--p1ai): the static site + /api/ proxied to the API on 127.0.0.1:8000.
# Same origin → the browser needs no CORS. Put into /etc/nginx/sites-available/domshchenkov and enable.
# TLS: certbot --nginx -d xn--b1adduihee9g.xn--p1ai -d www.xn--b1adduihee9g.xn--p1ai

limit_req_zone $binary_remote_addr zone=dsh_events:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=dsh_forms:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=dsh_login:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=dsh_admin:10m  rate=20r/s;
limit_req_status 429;

# access log without query strings (admin searches carry phone numbers) and without IPs of visitors
log_format dsh_noquery '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name xn--b1adduihee9g.xn--p1ai www.xn--b1adduihee9g.xn--p1ai;
    return 301 https://xn--b1adduihee9g.xn--p1ai$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.xn--b1adduihee9g.xn--p1ai;
    ssl_certificate     /etc/letsencrypt/live/xn--b1adduihee9g.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--b1adduihee9g.xn--p1ai/privkey.pem;
    return 301 https://xn--b1adduihee9g.xn--p1ai$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xn--b1adduihee9g.xn--p1ai;
    ssl_certificate     /etc/letsencrypt/live/xn--b1adduihee9g.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--b1adduihee9g.xn--p1ai/privkey.pem;

    access_log /var/log/nginx/domshchenkov.log dsh_noquery;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # the static site is deployed to its own docroot (deploy/deploy-site.sh), never the git checkout
    root /var/www/domshchenkov;
    index index.html;

    # belt and braces: nothing but the site, even if a checkout ends up here by mistake
    location ~ ^/(\.|backend/|src/|tools/|docs/|content/|\.build-manifest\.json) { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # --- API
    client_max_body_size 16k;

    location = /api/v1/events {
        limit_req zone=dsh_events burst=20 nodelay;
        include /etc/nginx/snippets/dsh-proxy.conf;
    }
    location ~ ^/api/v1/(leads|reviews)$ {
        limit_req zone=dsh_forms burst=5 nodelay;
        include /etc/nginx/snippets/dsh-proxy.conf;
    }
    location = /api/v1/admin/auth/login {
        limit_req zone=dsh_login burst=5 nodelay;
        include /etc/nginx/snippets/dsh-proxy.conf;
    }
    location /api/ {
        limit_req zone=dsh_admin burst=40 nodelay;
        include /etc/nginx/snippets/dsh-proxy.conf;
    }
}

