# nginx for домщенков.рф (xn--b1adduihee9g.xn--p1ai): the static site + /api/ and /admin/ proxied to the API on
# 127.0.0.1:8000. Same origin → the browser needs no CORS. Works with nginx 1.18+ (Ubuntu 22.04 / 24.04, Debian 12).
# deploy/server-setup.sh installs it: first an HTTP-only server answers the Let's Encrypt check from
# /var/www/letsencrypt, certbot gets the certificate (--webroot), then this file is enabled. Renewals use the same
# webroot through the port-80 server below (certbot.timer, reload of nginx in the deploy hook).

limit_req_zone $binary_remote_addr zone=dsh_events:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=dsh_forms:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=dsh_login:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=dsh_admin:10m  rate=20r/s;
limit_req_status 429;

# access log without query strings (admin searches carry phone numbers) and without IPs of visitors
log_format dsh_noquery '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name xn--b1adduihee9g.xn--p1ai www.xn--b1adduihee9g.xn--p1ai;
    server_tokens off;   # in every server: no «nginx/1.x (Ubuntu)» in redirects and error pages
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }   # certificate renewals
    location / { return 301 https://xn--b1adduihee9g.xn--p1ai$request_uri; }
}

server {
    listen 443 ssl http2;            # on nginx ≥ 1.25.1 «http2 on;» is the new spelling (a warning only)
    listen [::]:443 ssl http2;
    server_name www.xn--b1adduihee9g.xn--p1ai;
    ssl_certificate     /etc/letsencrypt/live/xn--b1adduihee9g.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--b1adduihee9g.xn--p1ai/privkey.pem;
    server_tokens off;
    return 301 https://xn--b1adduihee9g.xn--p1ai$request_uri;
}

server {
    listen 443 ssl http2;            # on nginx ≥ 1.25.1 «http2 on;» is the new spelling (a warning only)
    listen [::]:443 ssl http2;
    server_name xn--b1adduihee9g.xn--p1ai;
    ssl_certificate     /etc/letsencrypt/live/xn--b1adduihee9g.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--b1adduihee9g.xn--p1ai/privkey.pem;

    access_log /var/log/nginx/domshchenkov.log dsh_noquery;
    charset utf-8;
    server_tokens off;
    # Site pages. The API and the panel set their own, stricter headers: dsh-proxy.conf has its own add_header,
    # so these are not inherited there (no duplicates such as two Referrer-Policy values).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/xml text/xml
               image/svg+xml application/manifest+json text/plain;

    # the static site is deployed to its own docroot (deploy.sh rsyncs the release's site/), never the git checkout
    root /var/www/domshchenkov;
    index index.html;

    # one address per page (SEO): /index.html → /, /maltipu/index.html → /maltipu/; /maltipu → /maltipu/ nginx does
    # itself
    if ($request_uri ~ ^(/(?:[^?]*/)?)index\.html(\?.*)?$) {
        return 301 $1$2;
    }

    # belt and braces: nothing but the site, even if a checkout ends up here by mistake
    location ~ /\.(?!well-known) { return 404; }
    location ~ ^/(backend|src|tools|docs|content|deploy|dist)/ { return 404; }
    location = /.build-manifest.json { return 404; }

    # «Страница не найдена» from the build (tools/seo.py), code 404; /api/ keeps its own JSON errors
    # A folder without index.html (/assets/img/) gets the same page: nginx answers 403 there, autoindex is off.
    # Only the server's own 403: /api/ and /admin/ pass the API's 403 through untouched (no proxy_intercept_errors).
    error_page 404 /404.html;
    error_page 403 =404 /404.html;
    location = /404.html { internal; expires -1; }

    location / {
        try_files $uri $uri/ =404;
        expires -1;   # HTML: no-cache — new puppies and texts are visible at once
    }
    location ~* \.(?:css|js)$ {
        expires 1y;   # links carry ?v=<hash>: a changed file gets a new address
    }
    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|mp4|webm|woff2?)$ {
        expires 30d;
    }
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 7d;
    }
    location = /robots.txt  { expires 1d; }
    location = /sitemap.xml { expires 1h; }

    # --- admin panel: static files from the API container (backend/admin_ui), same origin as the site.
    # Not in the site docroot, so the site rsync (--delete) never touches it.
    # Panel only from the office / VPN: uncomment `allow …; deny all;` here AND in the two /api/v1/admin blocks below.
    location = /admin { return 301 /admin/; }
    location ^~ /admin/ {
        # allow 203.0.113.10; deny all;
        limit_req zone=dsh_admin burst=40 nodelay;
        include /etc/nginx/snippets/dsh-proxy.conf;
    }

    # --- API
    client_max_body_size 16k;

    location = /api/v1/events {
        limit_req zone=dsh_events burst=20 nodelay;
        include /etc/nginx/snippets/dsh-proxy.conf;
    }
    location ~ ^/api/v1/(leads|reviews)$ {
        limit_req zone=dsh_forms burst=5 nodelay;
        include /etc/nginx/snippets/dsh-proxy.conf;
    }
    location = /api/v1/admin/auth/login {
        # allow 203.0.113.10; deny all;
        limit_req zone=dsh_login burst=5 nodelay;
        include /etc/nginx/snippets/dsh-proxy.conf;
    }
    location ^~ /api/v1/admin/ {
        # allow 203.0.113.10; deny all;
        limit_req zone=dsh_admin burst=40 nodelay;
        include /etc/nginx/snippets/dsh-proxy.conf;
    }
    location /api/ {
        limit_req zone=dsh_admin burst=40 nodelay;
        include /etc/nginx/snippets/dsh-proxy.conf;
    }
}

