name: Backend tests

on:
  push:
    paths:
      - backend/**
      - src/data/*.json
      - src/templates/**
      - assets/js/**
      - .github/workflows/backend-tests.yml
  pull_request:
    paths:
      - backend/**
      - src/data/*.json
      - src/templates/**
      - assets/js/**
      - .github/workflows/backend-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dsh
          POSTGRES_PASSWORD: dsh
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # test data only: GitHub is outside Russia, never point CI at real personal data
      DSH_TEST_DATABASE_URL: postgresql+psycopg://dsh:dsh@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Models and migrations are in sync
        env:
          DSH_DATABASE_URL: postgresql+psycopg://dsh:dsh@localhost:5432/dsh_check
        run: |
          psql postgresql://dsh:dsh@localhost:5432/postgres -c "CREATE DATABASE dsh_check"
          python -m app migrate
          alembic check

  site:
    # templates and data changes must be committed together with the generated pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "jinja2==3.1.*"
      - run: python tools/build.py
      - run: git diff --exit-code
