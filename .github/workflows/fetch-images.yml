name: Fetch full-size photos

on:
  push:
    paths:
      - tools/images.json
      - tools/fetch_images.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-build.txt
      - run: python tools/fetch_images.py
      - run: python tools/image_assets.py
      - run: python tools/build.py && python tools/build.py --full
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img assets/css assets/js .build-manifest.json sitemap.xml
          git add -u -- '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Replace photo previews with full-size originals"
          # the Yandex Disk workflow may push to the same branch at the same time: rebase and retry
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break; sleep $((i * 5)); done
