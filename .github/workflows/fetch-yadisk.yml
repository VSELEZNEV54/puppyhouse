name: Fetch client photos from Yandex Disk

on:
  push:
    paths:
      - tools/yadisk.json
      - tools/yadisk-pick.json
      - tools/yadisk_fetch.py
      - .github/workflows/fetch-yadisk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: List folders and build contact sheets (when tools/yadisk/manifest.json is missing)
        run: test -f tools/yadisk/manifest.json || python -u tools/yadisk_fetch.py list
      - name: Download picked photos and videos (when tools/yadisk-pick.json exists)
        run: test -f tools/yadisk-pick.json && python -u tools/yadisk_fetch.py pick || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in tools/yadisk assets/img assets/video; do [ -e "$d" ] && git add -A "$d"; done
          git diff --cached --quiet && exit 0
          git commit -m "Client photos from Yandex Disk"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
