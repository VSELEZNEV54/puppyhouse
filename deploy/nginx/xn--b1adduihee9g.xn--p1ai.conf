# домщенков.рф (xn--b1adduihee9g.xn--p1ai) — nginx на сервере Timeweb Cloud (Ubuntu 24.04, Санкт-Петербург).
# Ставится в /etc/nginx/sites-available/ и включается ссылкой в sites-enabled. Сертификат — certbot (Let's Encrypt).
#
# Что делает для SEO:
#   http → https и www → без www одним 301 — у сайта один адрес;
#   /страница/index.html → /страница/ (301), /страница → /страница/ (301, это делает сам nginx для папок);
#   своя страница 404 с кодом 404 (а не 200);
#   gzip, кэш для картинок, CSS и JS (у CSS/JS в ссылках ?v=хеш — после выкладки браузер берёт новые).
#
# Сайт выкладывается в /var/www/domshchenkov/ (только собранные файлы: страницы, assets, robots.txt, sitemap.xml,
# 404.html, favicon.ico, site.webmanifest — без src/, tools/, docs/, content/, .git).

server {
    listen 80;
    listen [::]:80;
    server_name xn--b1adduihee9g.xn--p1ai www.xn--b1adduihee9g.xn--p1ai;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://xn--b1adduihee9g.xn--p1ai$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.xn--b1adduihee9g.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn--b1adduihee9g.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--b1adduihee9g.xn--p1ai/privkey.pem;

    return 301 https://xn--b1adduihee9g.xn--p1ai$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xn--b1adduihee9g.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn--b1adduihee9g.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--b1adduihee9g.xn--p1ai/privkey.pem;

    root /var/www/domshchenkov;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml text/xml
               image/svg+xml application/manifest+json text/plain;

    # дубли главных страниц: /maltipu/index.html → /maltipu/
    if ($request_uri ~ ^(/[^?]*/)index\.html(\?.*)?$) {
        return 301 $1$2;
    }

    # служебное в корень не выкладывается, но на всякий случай
    location ~ /\.(?!well-known) { return 404; }
    location ~ ^/(src|tools|docs|content|deploy)/ { return 404; }

    location / {
        expires -1;   # HTML: Cache-Control: no-cache — новые цены и щенки видны сразу
    }

    location ~* \.(?:css|js)$ {
        expires 1y;
    }

    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|mp4|webm|woff2?)$ {
        expires 30d;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 7d;
    }

    location = /robots.txt  { expires 1d; }
    location = /sitemap.xml { expires 1h; }

    error_page 404 /404.html;
    location = /404.html { internal; expires -1; }
}
